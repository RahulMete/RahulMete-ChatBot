<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Local AI</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#0f1115;color:#e8eaf0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{padding:10px 14px;background:#171a21;border-bottom:1px solid #2a2f3b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  header b{margin-right:4px}
  #url{flex:1;min-width:200px;background:#1e222b;color:#e8eaf0;border:1px solid #2a2f3b;border-radius:8px;padding:9px 10px;font:inherit}
  button{background:#6c8cff;color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
  button.gray{background:#2a2f3b}
  #dot{font-size:13px;color:#8b93a7}
  #chat{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:12px}
  .m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .u{align-self:flex-end;background:#243055}
  .a{align-self:flex-start;background:#171a21;border:1px solid #2a2f3b}
  .err{color:#ff8a8a}
  footer{display:flex;gap:8px;padding:12px 14px;background:#171a21;border-top:1px solid #2a2f3b}
  #msg{flex:1;background:#1e222b;color:#e8eaf0;border:1px solid #2a2f3b;border-radius:8px;padding:10px;font:inherit;resize:none}
</style>
</head>
<body>
<header>
  <b>🤖 My Local AI</b>
  <input id="url" value="http://localhost:1234" placeholder="LM Studio URL">
  <button id="test" class="gray">Test</button>
  <span id="dot">●</span>
</header>

<div id="chat"><div class="m a">Hi! Paste your LM Studio URL above, then type a message below.</div></div>

<footer>
  <textarea id="msg" rows="1" placeholder="Type a message and press Enter…"></textarea>
  <button id="send">Send</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), urlBox = $('url'), msg = $('msg'), dot = $('dot');
let history = [];
let busy = false;

try { const s = localStorage.getItem('lmurl'); if (s) urlBox.value = s; } catch (e) {}

// Turn whatever the user pasted into  http://host:port/v1
function apiBase() {
  let u = urlBox.value.trim().replace(/\/+$/, '');
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  u = u.replace(/\/v1\/.*$/, '').replace(/\/v1$/, '');
  return u + '/v1';
}

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function explain(e) {
  if (e instanceof TypeError) {
    return "Can't reach LM Studio. Check that:\n" +
      "1) LM Studio server is Running (Developer tab)\n" +
      "2) \"Enable CORS\" is turned ON in the server settings\n" +
      "3) The URL is correct (usually http://localhost:1234)";
  }
  return e.message;
}

// ngrok shows a warning page to browsers; this header skips it (only added for ngrok links)
function extra() {
  return /ngrok/i.test(urlBox.value) ? { 'ngrok-skip-browser-warning': 'true' } : {};
}

async function getModel() {
  const r = await fetch(apiBase() + '/models', { headers: extra() });
  if (!r.ok) throw new Error('Server answered with HTTP ' + r.status);
  const j = await r.json();
  if (!j.data || !j.data.length) throw new Error('No model is loaded in LM Studio. Load one first.');
  const chatModels = j.data.filter(m => !/embed/i.test(m.id));
  if (!chatModels.length) throw new Error('Only embedding models are loaded. Load a chat model like gemma in LM Studio.');
  return chatModels[0].id;
}

$('test').onclick = async () => {
  try {
    const m = await getModel();
    dot.style.color = '#5fd38d'; dot.textContent = '● Connected: ' + m;
    localStorage.setItem('lmurl', urlBox.value);
  } catch (e) {
    dot.style.color = '#ff6b6b'; dot.textContent = '● Not connected';
    add(explain(e), 'a err');
  }
};

async function send() {
  const text = msg.value.trim();
  if (!text || busy) return;
  busy = true; msg.value = '';
  add(text, 'u');
  history.push({ role: 'user', content: text });
  const bubble = add('…', 'a');
  let reply = '';
  try {
    const model = await getModel();
    const r = await fetch(apiBase() + '/chat/completions', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, extra()),
      body: JSON.stringify({ model, messages: history, stream: true })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + (await r.text()).slice(0, 200));
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        const l = line.trim();
        if (!l.startsWith('data:')) continue;
        const data = l.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const t = JSON.parse(data).choices[0].delta.content;
          if (t) { reply += t; bubble.textContent = reply; chat.scrollTop = chat.scrollHeight; }
        } catch (_) {}
      }
    }
    if (reply) history.push({ role: 'assistant', content: reply });
    else bubble.textContent = '(empty reply)';
    localStorage.setItem('lmurl', urlBox.value);
    dot.style.color = '#5fd38d'; dot.textContent = '● Connected: ' + model;
  } catch (e) {
    bubble.textContent = explain(e);
    bubble.classList.add('err');
    history.pop();
    dot.style.color = '#ff6b6b'; dot.textContent = '● Not connected';
  }
  busy = false;
}

$('send').onclick = send;
msg.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
